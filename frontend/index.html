<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLW Asset Management Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <ion-icon name="train-outline"></ion-icon>
                <h2>BLW AMS</h2>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <a href="#" class="nav-item active" data-dept="all">
                    <ion-icon name="grid-outline"></ion-icon>
                    <span>Overview</span>
                </a>
                <!-- Departments injected by JS -->
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item logout" id="logoutBtn">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" id="searchInput" placeholder="Global search: name, person, location...">
                </div>
                <div class="user-profile">
                    <span id="userRoleBadge" class="role-badge"></span>
                    <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" id="userAvatar" alt="User">
                    <span id="userName">User</span>
                </div>
            </header>

            <section class="content-area">
                <div class="content-header">
                    <h1 id="deptTitle">Asset Overview</h1>
                    <div class="header-actions">
                        <button class="btn-secondary" id="exportBtn">
                            <ion-icon name="download-outline"></ion-icon> Export CSV
                        </button>
                        <button class="btn-primary admin-only" id="addAssetBtn">
                            <ion-icon name="add-outline"></ion-icon> Add Asset
                        </button>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="main-column">
                        <!-- Stats Cards -->
                        <div class="stats-grid">
                            <div class="stat-card">
                                <h3>Total Assets Tracked</h3>
                                <p id="totalAssets">...</p>
                            </div>
                            <div class="stat-card" style="background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3);">
                                <h3 style="color: var(--accent-color);">Locos Produced (Since 1956)</h3>
                                <p style="color: white;">11,259+</p>
                            </div>
                            <div class="stat-card">
                                <h3>Condition Breakdown</h3>
                                <canvas id="conditionChart" height="100"></canvas>
                            </div>
                            <div class="stat-card">
                                <h3>Dept Distribution</h3>
                                <canvas id="deptChart" height="100"></canvas>
                            </div>
                        </div>

                        <!-- Data Table -->
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Asset Details</th>
                                        <th>Location/Assignee</th>
                                        <th>Qty</th>
                                        <th>Status</th>
                                        <th>Maint. Due</th>
                                        <th class="admin-only">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <!-- Rows injected by JS -->
                                </tbody>
                            </table>
                            <div class="pagination">
                                <button class="btn-icon" id="prevPage"><ion-icon name="chevron-back-outline"></ion-icon></button>
                                <span id="pageInfo">Page 1 of 1</span>
                                <button class="btn-icon" id="nextPage"><ion-icon name="chevron-forward-outline"></ion-icon></button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="side-column">
                        <div class="activity-feed">
                            <h3>Recent Activity</h3>
                            <div id="activityList" class="activity-list">
                                <!-- Activity injected by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add Asset Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2>Add New Asset</h2>
                <button class="close-btn"><ion-icon name="close-outline"></ion-icon></button>
            </div>
            <form id="addAssetForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" id="itemName" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="itemCategory" required>
                            <option value="Machinery">Machinery</option>
                            <option value="Electrical Equipment">Electrical Equipment</option>
                            <option value="IT Hardware">IT Hardware</option>
                            <option value="Tools">Tools</option>
                            <option value="Spare Parts">Spare Parts</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Department *</label>
                        <select id="itemDept" required></select>
                    </div>
                    <div class="form-group">
                        <label>Quantity *</label>
                        <input type="number" id="itemQty" min="1" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Condition *</label>
                        <select id="itemCondition" required>
                            <option value="New">New</option>
                            <option value="Good">Good</option>
                            <option value="Needs Repair">Needs Repair</option>
                            <option value="Decommissioned">Decommissioned</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Asset Value (₹)</label>
                        <input type="number" id="itemValue" min="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="itemLocation" placeholder="e.g. Bay 2">
                    </div>
                    <div class="form-group">
                        <label>Assigned To</label>
                        <input type="text" id="itemAssignee" placeholder="e.g. Assembly Chief">
                    </div>
                </div>
                <div class="form-group">
                    <label>Technical Specifications (JSON or plain text)</label>
                    <input type="text" id="itemSpecs" placeholder='e.g. {"HP": "6000", "MaxSpeed": "140 km/h"}'>
                </div>
                <button type="submit" class="btn-primary w-full">Save Asset</button>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
