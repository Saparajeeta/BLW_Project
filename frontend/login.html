<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BLW Locomotive Tracking</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('assets/images/blw_bg.jpg') center/cover no-repeat;
        }
        .login-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 30, 0.85); /* Dark overlay */
            z-index: 0;
        }
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            backdrop-filter: blur(12px);
            text-align: center;
        }
        .logo {
            margin-bottom: 2rem;
        }
        .logo h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .form-group {
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="login-overlay"></div>
    
    <div class="login-container" id="loginFormContainer">
        <div class="logo">
            <h2>BLW Varanasi</h2>
            <p>Locomotive Production Tracking System</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
    </div>

    <!-- Password Reset Modal (shows on first login) -->
    <div class="modal-overlay hidden" id="resetModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem;">Password Reset Required</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
                For security reasons, you must change your default password before proceeding.
            </p>
            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password (min 6 characters)</label>
                    <input type="password" id="newPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required minlength="6">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Update Password</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const data = await window.apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                if (data.user.password_reset_required) {
                    document.getElementById('resetModal').classList.remove('hidden');
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                // Toast handles error display
            }
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                window.showToast('Passwords do not match', 'danger');
                return;
            }

            try {
                const data = await window.apiFetch('/auth/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({ newPassword })
                });

                localStorage.setItem('token', data.token);
                // update user locally
                const user = JSON.parse(localStorage.getItem('user'));
                user.password_reset_required = false;
                localStorage.setItem('user', JSON.stringify(user));

                window.showToast('Password updated successfully. Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } catch (err) {
                // error handled by apiFetch
            }
        });

        // Check if redirected here to reset
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('reset') === 'true') {
            document.getElementById('resetModal').classList.remove('hidden');
        }
    </script>
</body>
</html>
