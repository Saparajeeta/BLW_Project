<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BLW AMS</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <ion-icon name="train-outline" class="login-logo"></ion-icon>
                <h2>Welcome Back</h2>
                <p>Sign in to BLW Asset Management System</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <input type="text" id="username" class="login-input" placeholder="Username (e.g. admin or viewer)" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="login-input" placeholder="Password (e.g. admin123)" required>
                </div>
                <button type="submit" class="btn-primary w-full login-btn" id="loginBtn">Login</button>
            </form>
        </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            btn.textContent = 'Authenticating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('ams_token', data.token);
                    localStorage.setItem('ams_role', data.role);
                    localStorage.setItem('ams_user', username);
                    window.location.href = 'index.html';
                } else {
                    showToast(data.error || 'Login failed', 'error');
                    btn.textContent = 'Login';
                    btn.disabled = false;
                }
            } catch (err) {
                showToast('Server error', 'error');
                btn.textContent = 'Login';
                btn.disabled = false;
            }
        });

        function showToast(message, type='success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
