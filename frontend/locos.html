<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locomotives - BLW</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <script src="js/app.js"></script>
    <script>requireAuth();</script>

    <div class="container">
        <div class="card-header mb-1">
            <span>Locomotives Tracking</span>
            <div style="display: flex; gap: 1rem;">
                <input type="text" id="searchInput" placeholder="Search Loco Number..." style="padding: 0.5rem; width: 250px;">
                <button class="btn-primary" id="addLocoBtn" style="display: none;">Add New Loco</button>
            </div>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Loco Number</th>
                            <th>Model</th>
                            <th>Start Date</th>
                            <th>Target Dispatch</th>
                            <th>Current Stage</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="locosTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Loco Modal -->
    <div class="modal-overlay hidden" id="addLocoModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem;">Add New Locomotive</h3>
            <form id="addLocoForm">
                <div class="form-group">
                    <label>Loco Number</label>
                    <input type="text" id="locoNumber" required>
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <select id="locoModel" required>
                        <option value="WAP-7">WAP-7</option>
                        <option value="WAG-9">WAG-9</option>
                        <option value="WAG-9H">WAG-9H</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="form-group">
                    <label>Target Dispatch Date</label>
                    <input type="date" id="targetDate" required>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn-primary" style="flex: 1;">Save</button>
                    <button type="button" class="btn-secondary" style="flex: 1;" onclick="document.getElementById('addLocoModal').classList.add('hidden')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Update Stage Modal -->
    <div class="modal-overlay hidden" id="updateStageModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem;" id="updateStageTitle">Update Stage</h3>
            <form id="updateStageForm">
                <input type="hidden" id="updateLocoNumber">
                <div class="form-group">
                    <label>Action</label>
                    <select id="stageAction" required>
                        <option value="Forward">Move Forward (→)</option>
                        <option value="Back">Send Back (←)</option>
                    </select>
                </div>
                
                <div id="dispatchFields" class="hidden">
                    <div class="form-group">
                        <label>Destination Zone</label>
                        <input type="text" id="destZone">
                    </div>
                    <div class="form-group">
                        <label>Receiving Shed</label>
                        <input type="text" id="receivingShed">
                    </div>
                    <div class="form-group">
                        <label>Consignment Number</label>
                        <input type="text" id="consignmentNum">
                    </div>
                </div>

                <div class="form-group">
                    <label>Remarks (Mandatory)</label>
                    <textarea id="stageRemarks" rows="3" required placeholder="Reason for update..."></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn-primary" style="flex: 1;">Confirm Update</button>
                    <button type="button" class="btn-secondary" style="flex: 1;" onclick="document.getElementById('updateStageModal').classList.add('hidden')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/locos.js"></script>
</body>
</html>
